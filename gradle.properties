# ============================================================================
# NES Fork GAV 核心配置（与 Spring Boot 2.7 NES 的 forkGroupIdBase / version 命名对齐）
# ============================================================================
# projectGroup —— 发布用 GroupId（对应 Boot 侧 forkGroupIdBase）
projectGroup=cn.bjca.footstone.bpring

# version —— 当前 fork 发布版本（Maven GAV）
version=6.2.19-nes.patch.1-SNAPSHOT

# originalVersion —— 上游 Spring 基线版本（对应 Boot 侧 springBootVersion）
#   写入 MANIFEST Implementation-Version，供 SpringVersion.getVersion() 返回 major.minor.patch
originalVersion=6.2.19

org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true

kotlinVersion=1.9.25

kotlin.jvm.target.validation.mode=ignore
kotlin.stdlib.default.dependency=false
